<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBF9"/>
      <stop offset="1" stop-color="#EAF6F0"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173B2E"/>
      <stop offset="1" stop-color="#275E4C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#173B2E" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="95" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="44" font-weight="900" fill="#173B2E">软件规模与验证结果</text>
  <text x="90" y="140" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="24" fill="#61736A">规模满足课程要求，关键流程有自动化测试和构建验证</text>

  <g filter="url(#shadow)" font-family="PingFang SC, Microsoft YaHei, Arial">
    <rect x="100" y="220" width="410" height="210" rx="30" fill="url(#dark)"/>
    <rect x="595" y="220" width="410" height="210" rx="30" fill="#FFFFFF"/>
    <rect x="1090" y="220" width="410" height="210" rx="30" fill="#FFFFFF"/>
    <text x="145" y="285" font-size="25" fill="#CDE8DB">自动化测试文件</text>
    <text x="145" y="360" font-size="72" font-weight="900" fill="#FFFFFF">11</text>
    <text x="235" y="360" font-size="28" fill="#DDF3E8">个</text>
    <text x="145" y="395" font-size="22" fill="#B8D9C9">覆盖 auth / decision / meals / feedback</text>
    <text x="640" y="285" font-size="25" fill="#61736A">主要源文件</text>
    <text x="640" y="360" font-size="72" font-weight="900" fill="#173B2E">105</text>
    <text x="775" y="360" font-size="28" fill="#61736A">个</text>
    <text x="640" y="395" font-size="22" fill="#61736A">后端 app + 前端 bsapp/src</text>
    <text x="1135" y="285" font-size="25" fill="#61736A">代码总行数</text>
    <text x="1135" y="360" font-size="72" font-weight="900" fill="#173B2E">149,823</text>
    <text x="1135" y="395" font-size="22" fill="#61736A">远超 500 行要求</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="100" y="500" width="1400" height="270" rx="32" fill="#FFFFFF"/>
  </g>
  <text x="145" y="560" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="30" font-weight="900" fill="#173B2E">关键验证链路</text>
  <g font-family="PingFang SC, Microsoft YaHei, Arial">
    <g transform="translate(150 615)">
      <circle cx="24" cy="24" r="24" fill="#EAF7EF"/><text x="24" y="32" text-anchor="middle" font-size="22" font-weight="900" fill="#1B7F5F">1</text>
      <text x="62" y="18" font-size="24" font-weight="900" fill="#173B2E">个性化目标</text>
      <text x="62" y="52" font-size="20" fill="#61736A">身高体重、运动频次、自定义目标</text>
    </g>
    <g transform="translate(500 615)">
      <circle cx="24" cy="24" r="24" fill="#FFF1D2"/><text x="24" y="32" text-anchor="middle" font-size="22" font-weight="900" fill="#9A651B">2</text>
      <text x="62" y="18" font-size="24" font-weight="900" fill="#173B2E">确认摄入</text>
      <text x="62" y="52" font-size="20" fill="#61736A">只有确认后才写入长期营养</text>
    </g>
    <g transform="translate(850 615)">
      <circle cx="24" cy="24" r="24" fill="#F4F3FF"/><text x="24" y="32" text-anchor="middle" font-size="22" font-weight="900" fill="#5C56B1">3</text>
      <text x="62" y="18" font-size="24" font-weight="900" fill="#173B2E">偏好记忆</text>
      <text x="62" y="52" font-size="20" fill="#61736A">评分文字解析为 liked / avoid</text>
    </g>
    <g transform="translate(1200 615)">
      <circle cx="24" cy="24" r="24" fill="#EAF7EF"/><text x="24" y="32" text-anchor="middle" font-size="22" font-weight="900" fill="#1B7F5F">4</text>
      <text x="62" y="18" font-size="24" font-weight="900" fill="#173B2E">前端构建</text>
      <text x="62" y="52" font-size="20" fill="#61736A">两个 uni-app 目录均 build 通过</text>
    </g>
  </g>
  <rect x="145" y="720" width="1310" height="1" fill="#E1ECE6"/>
  <text x="145" y="750" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="22" fill="#61736A">最新验证：15 个相关 pytest 通过；H5 主前端和嵌套前端均 DONE Build complete。</text>
</svg>

      <text x="250" y="47" fill="#35463D">多菜谱/文本 -> 合并购物清单</text>
      <text x="690" y="47" fill="#9A651B">场景二_清单导出</text>
      <text x="1010" y="47" fill="#35463D">同名合并、数量保留、可复制</text>
    </g>
    <g transform="translate(115 735)">
      <rect width="1370" height="76" rx="18" fill="#EAF7EF"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFDFB"/>
      <stop offset="1" stop-color="#EEF7F2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#173B2E" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="70" y="60" width="1460" height="780" rx="36" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="115" y="122" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="42" font-weight="900" fill="#173B2E">角色化功能测试矩阵</text>
  <text x="115" y="164" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="23" fill="#66756D">功能展示和测试场景一一对应，现场演示可以按角色切换</text>

  <g font-family="PingFang SC, Microsoft YaHei, Arial">
    <rect x="115" y="205" width="1370" height="60" rx="16" fill="#173B2E"/>
    <text x="165" y="244" font-size="22" font-weight="900" fill="#FFFFFF">角色</text>
    <text x="365" y="244" font-size="22" font-weight="900" fill="#FFFFFF">功能路径</text>
    <text x="805" y="244" font-size="22" font-weight="900" fill="#FFFFFF">测试材料</text>
    <text x="1125" y="244" font-size="22" font-weight="900" fill="#FFFFFF">验证点</text>
  </g>

  <g font-family="PingFang SC, Microsoft YaHei, Arial" font-size="21">
    <g transform="translate(115 285)">

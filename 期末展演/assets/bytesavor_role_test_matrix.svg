      <text x="250" y="47" fill="#35463D">确认摄入 -> 评分原因 -> 偏好记忆</text>
      <text x="690" y="47" fill="#1B7F5F">test_feedback_memory.py</text>
      <text x="1010" y="47" fill="#35463D">liked/avoid 写库并影响推荐</text>
    </g>

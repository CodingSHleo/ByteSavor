      <text x="50" y="47" font-weight="900" fill="#173B2E">家庭做饭</text>
      <text x="250" y="47" fill="#35463D">拍照识别 -> 校正 -> 推荐 -> 清单</text>
      <text x="690" y="47" fill="#1B7F5F">场景一_拍照推荐</text>
      <text x="1010" y="47" fill="#35463D">可删改、推荐多道菜、不误计入</text>
    </g>
    <g transform="translate(115 375)">
      <rect width="1370" height="76" rx="18" fill="#FFF8EA"/>
      <text x="50" y="47" font-weight="900" fill="#173B2E">健康管理</text>
      <text x="250" y="47" fill="#35463D">餐盘识别 -> 确认摄入 -> 看板</text>
      <text x="690" y="47" fill="#9A651B">场景四_营养分析</text>
      <text x="1010" y="47" fill="#35463D">确认才写入；错误可删除</text>
    </g>
    <g transform="translate(115 465)">
      <rect width="1370" height="76" rx="18" fill="#F4F3FF"/>
      <text x="50" y="47" font-weight="900" fill="#173B2E">买菜用户</text>
      <text x="250" y="47" fill="#35463D">拍水果/食材 -> 品质鉴定</text>
      <text x="690" y="47" fill="#5C56B1">场景三_品质鉴定</text>
      <text x="1010" y="47" fill="#35463D">等级、依据、购买建议</text>
    </g>
    <g transform="translate(115 555)">
      <rect width="1370" height="76" rx="18" fill="#F3FAF6"/>
      <text x="50" y="47" font-weight="900" fill="#173B2E">探店用户</text>
      <text x="250" y="47" fill="#35463D">拍菜品 -> 故事/口味/吃法</text>
      <text x="690" y="47" fill="#1B7F5F">场景五_探店向导</text>
      <text x="1010" y="47" fill="#35463D">VLM 识别 + LLM 补全讲解</text>
    </g>
    <g transform="translate(115 645)">
